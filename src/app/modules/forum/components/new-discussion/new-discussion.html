@if (onLoad() === "true") {
  <div class="app-container container">
    <div class="app-skeleton-loading-item app-loading-breadcrumb mb-2"></div>
    <div class="app-skeleton-loading-item app-loading-title mb-2"></div>
    <div id="this-loading-content" class="app-skeleton-loading-item"></div>
  </div>
} @else if (onLoad() === "success") {
  <app-breadcrumb [items]="breadcrumbItems()"></app-breadcrumb>

  <div class="app-container container">
    <div class="border-bottom mb-3">
      <h1 class="fs-3">{{ "DISCUSSION_PAGE.NEW_DISCUSSION" | translate }}</h1>
    </div>

    <form [formGroup]="form()">
      <div class="mb-3">
        <app-input
          [id]="'this-title'"
          [label]="'GENERAL.TITLE' | translate"
          [placeholder]="'GENERAL.ENTER_TITLE' | translate"
          [type]="'text'"
          [control]="'title'"
        ></app-input>
      </div>
    </form>

    <app-message-input
      [isNew]="true"
      [additionalValidation]="{
        exist: true,
        value: form().valid,
      }"
      [onPost]="onPost()"
      (post)="onSubmit($event)"
    ></app-message-input>

    @if (onPost() === "error") {
      <div class="alert alert-danger mt-3">
        {{ "DISCUSSION_PAGE.NEW_DISCUSSION_ERROR" | translate }}
      </div>
    }
  </div>
}
