version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - |
          if [ "$AWS_BRANCH" = "main" ]; then
            npm run build -- --configuration=production
          else
            npm run build -- --configuration=development
          fi
  artifacts:
    baseDirectory: dist/discussions
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
