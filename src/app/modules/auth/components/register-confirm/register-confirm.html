<div class="card app-auth-card">
  <div class="card-body text-center">
    @if (onRegisterConfirm() === "true") {
      <span class="fa-solid fa-spinner fa-spin fa-2x"></span>

      <p class="mt-2">{{ "REGISTER_CONFIRM_PAGE.CONFIRMING" | translate }}</p>
    } @else if (onRegisterConfirm() === "error") {
      <small class="text-danger">
        <span class="fa-regular fa-circle-xmark"></span>
        {{ "REGISTER_CONFIRM_PAGE.ERROR" | translate }}
      </small>
    } @else if (onRegisterConfirm() === "success") {
      <small class="text-success">
        <span class="fa-regular fa-circle-check"></span>
        {{ "REGISTER_CONFIRM_PAGE.SUCCESS" | translate }}
      </small>
    }
  </div>
</div>
