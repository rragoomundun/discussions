@let config = configExists$ | async;

@if (
  (appService.platform() === "browser" && (onGetConfig$ | async) === "true") ||
  (onGetExists$ | async) === "true"
) {
  <div class="this-loader"></div>
} @else if (config?.config === false) {
  <main>
    <router-outlet></router-outlet>
  </main>
} @else {
  <app-header></app-header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
}
