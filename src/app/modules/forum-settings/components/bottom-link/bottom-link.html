<div class="card" [formGroup]="group()">
  <div class="card-body">
    <div class="d-flex align-items-start gap-2">
      <div class="flex-grow-1">
        <div class="mb-2">
          <input
            formControlName="name"
            type="text"
            class="form-control"
            [placeholder]="
              'FORUM_SETTINGS_PAGE.BOTTOM_LINKS_PAGE.LINK_TEXT' | translate
            "
          />
        </div>

        <div>
          <input
            formControlName="link"
            type="text"
            class="form-control"
            [placeholder]="
              'FORUM_SETTINGS_PAGE.BOTTOM_LINKS_PAGE.LINK_URL' | translate
            "
          />
        </div>
      </div>

      <button
        type="button"
        class="btn btn-link text-danger p-0"
        (click)="delete.emit()"
      >
        <span class="fas fa-times"></span>
      </button>
    </div>
  </div>
</div>
